<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Portfolio - Stéphanie Calderara</title>
</head>

<body>
    <header class="site-header">
        <a href="de/index.html" class="language-switch">DE</a>
        
        <div class="header-content">
            <h1>Stéphanie Calderara</h1>
            <p>Portfolio technique</p>

            <nav class="main-nav">
                <a href="index.html" class="active">Projets</a>
                <a href="cv/cv-stephanie-calderara.pdf" target="_blank">CV</a>
                <a href="contact.html">Contact</a>
                <a href="de/index.html" class="mobile-lang">DE</a>          
            </nav>
        </div>
    </header>

    <main>
        <section class="projects-text"       >
            <h2>Contact</h2>

            <p class="projects-text">
                Je suis toujours intéressée par de nouvelles opportunités et collaborations. 
                N'hésitez pas à me contacter pour de plus amples informations.
            </p>

            <form id="contact-form" action="https://formspree.io/f/mgodjeez" method="post" class="contact-form">

                <label for="name">Nom</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Sujet</label>
                <input type="text" id="subject" name="subject" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="8" required></textarea>

                <div class="form-actions">
                    <p id="form-status" class="form-status"></p>
                    <button type="submit" class="demo-button">Envoyer</button>
                </div>
            </form>

        </section>

        <footer id="contact">
            <p>Stéphanie Calderara • Nidau, Suisse • 2026</p>
        </footer>
    </main>

    <script>
        const form = document.getElementById("contact-form");
        const status = document.getElementById("form-status");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();
            status.className = "form-status";
            status.textContent = "";

            const data = new FormData(form);
            const response = await fetch("https://formspree.io/f/mgodjeez", {
                method: "POST",
                body: data,
                headers: {
                    "Accept": "application/json"
                }
            });

            console.log(response);

            if(response.ok) {
                status.textContent = "Merci pour votre message !";
                status.className = "form-status success";
                form.reset();
            } else {
                status.textContent = "Une erreur est survenue. Veuillez réessayer.";
                status.className = "form-status error";
            }

        });
    </script>
</body>
</html>
